services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: agent, POSTGRES_PASSWORD: agent, POSTGRES_DB: agent }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U agent"], interval: 5s, timeout: 3s, retries: 10 }
  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
  api:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    env_file: [.env.example]
    environment: { PORT: "4000", WEB_ORIGIN: "http://localhost:3000" }
    ports: ["4000:4000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"], interval: 10s, timeout: 3s, retries: 5 }
  web:
    build: { context: ., dockerfile: infrastructure/docker/web.Dockerfile, args: { NEXT_PUBLIC_API_URL: "http://localhost:4000" } }
    ports: ["3000:3000"]
    depends_on: { api: { condition: service_healthy } }
  admin:
    build: { context: ., dockerfile: infrastructure/docker/admin.Dockerfile }
    ports: ["3001:3001"]
volumes:
  pgdata:
